<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-label="Scatter of estimated shift against measured landing distance">
<style>
.bg{fill:#000000}.p{fill:#f0efec}.s{fill:#c3c2b7}.m{fill:#a3a19a}.grid{stroke:#2c2c2a}.axis{stroke:#4a4a47}
.c1{stroke:#3987e5}.c2{stroke:#d95926}.c3{stroke:#199e70}.cg{stroke:#a3a19a}.ref{stroke:#c3c2b7}
.f1{fill:#3987e5}.f2{fill:#d95926}.f3{fill:#199e70}.fg{fill:#a3a19a}
text{font:12px system-ui,sans-serif}.t{font-weight:600;font-size:14px}.pt{font-weight:600;font-size:12px}
polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
line{stroke-width:1}.refl{stroke-width:1;stroke-dasharray:4 3}
.d2{stroke-dasharray:7 3}.d3{stroke-dasharray:2 3}.dg{stroke-dasharray:5 4;stroke-width:1.5}
</style>
<rect class="bg" width="700" height="470"/>
<text class="p t" x="16" y="24">The estimate's shift against Joe's tape measure</text>
<text class="s" x="16" y="42">From flow arrival to touchdown; only flights whose estimate covers the touchdown.</text>
<line class="grid" x1="80" x2="640" y1="380.0" y2="380.0"/>
<text class="m" x="74.0" y="384.0" text-anchor="end">0</text>
<line class="grid" x1="80" x2="640" y1="333.8" y2="333.8"/>
<text class="m" x="74.0" y="337.8" text-anchor="end">10</text>
<line class="grid" x1="80" x2="640" y1="287.7" y2="287.7"/>
<text class="m" x="74.0" y="291.7" text-anchor="end">20</text>
<line class="grid" x1="80" x2="640" y1="241.5" y2="241.5"/>
<text class="m" x="74.0" y="245.5" text-anchor="end">30</text>
<line class="grid" x1="80" x2="640" y1="195.4" y2="195.4"/>
<text class="m" x="74.0" y="199.4" text-anchor="end">40</text>
<line class="grid" x1="80" x2="640" y1="149.2" y2="149.2"/>
<text class="m" x="74.0" y="153.2" text-anchor="end">50</text>
<line class="grid" x1="80" x2="640" y1="103.1" y2="103.1"/>
<text class="m" x="74.0" y="107.1" text-anchor="end">60</text>
<text class="m" x="80.0" y="396.0" text-anchor="middle">0</text>
<text class="m" x="166.2" y="396.0" text-anchor="middle">10</text>
<text class="m" x="252.3" y="396.0" text-anchor="middle">20</text>
<text class="m" x="338.5" y="396.0" text-anchor="middle">30</text>
<text class="m" x="424.6" y="396.0" text-anchor="middle">40</text>
<text class="m" x="510.8" y="396.0" text-anchor="middle">50</text>
<text class="m" x="596.9" y="396.0" text-anchor="middle">60</text>
<line class="axis" x1="80" x2="640" y1="380" y2="380"/>
<text class="m" x="360.0" y="412.0" text-anchor="middle">tape measure, take-off mark to the landed drone (cm)</text>
<text class="m" transform="translate(36,230.0) rotate(-90)" text-anchor="middle">shift by the estimate (cm)</text>
<polyline class="ref refl" points="80.0,380.0 640.0,80.0"><title>same on both</title></polyline>
<text class="s" x="579.7" y="99.1" text-anchor="end">estimate = tape</text>
<circle class="f2" cx="252.3" cy="307.7" r="6"><title>Failsafe high: tape 20 cm, estimate 16 cm</title></circle>
<text class="s" x="261.3" y="311.7" text-anchor="start">Failsafe high (0.2 m/s)</text>
<circle class="f2" cx="502.2" cy="176.8" r="6"><title>TOS 1: tape 49 cm, estimate 44 cm</title></circle>
<text class="s" x="511.2" y="180.8" text-anchor="start">TOS 1 (0.2 m/s)</text>
<circle class="f3" cx="596.9" cy="182.1" r="6"><title>TOS 2: tape 60 cm, estimate 43 cm</title></circle>
<text class="s" x="605.9" y="186.1" text-anchor="start">TOS 2 (0.4 m/s)</text>
<circle class="f1" cx="226.5" cy="221.7" r="6"><title>TOS 3: tape 17 cm, estimate 34 cm</title></circle>
<text class="s" x="235.5" y="225.7" text-anchor="start">TOS 3 (0.1 m/s)</text>
<circle class="f2" cx="166.2" cy="322.2" r="6"><title>TOS 4: tape 10 cm, estimate 13 cm</title></circle>
<text class="s" x="175.2" y="326.2" text-anchor="start">TOS 4 (0.2 m/s)</text>
<circle class="f1" cx="183.4" cy="234.6" r="6"><title>TOS 6: tape 12 cm, estimate 32 cm</title></circle>
<text class="s" x="192.4" y="238.6" text-anchor="start">TOS 6 (0.1 m/s)</text>
<text class="s" x="80.0" y="425.0" text-anchor="start">Color is the climb speed: blue 0.1, orange 0.2, aqua 0.4 m/s. The 0.1 m/s take-offs stayed</text>
<text class="s" x="80.0" y="441.0" text-anchor="start">below 0.06 m, where the firmware's flow model counts the height as 0.1 m and overstates speed.</text>
</svg>