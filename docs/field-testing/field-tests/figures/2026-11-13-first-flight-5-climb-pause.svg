<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Height and sideways distance against time for eight take-offs. Every climb pauses at about 0.3 metres for about 0.4 seconds after the hand-over. Flights 2 and 7 slide 7 and 9 centimetres through the pause before the position hold pulls them back. Flight 4 reads 12 centimetres, on an estimate that was running away at the take-off.">
