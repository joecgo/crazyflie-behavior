[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crazyflie-behavior"
version = "0.1.0"
description = "A Crazyflie nano drone that plays hide-and-seek, built architecture-first with ADRs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cflib==0.1.34",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
where = ["src"]

# --- pytest (ADR-0010) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

# --- ruff: formatting and linting (ADR-0004) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
# Docs quote cflib's own examples in cflib's style; don't reformat them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports, undefined names
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # modern Python syntax
    "N",    # naming conventions
    "SIM",  # simplifications
    "RUF",  # ruff-specific checks
    "PT",   # pytest style
    "BLE",  # blind except: catching everything without re-raising or logging (ADR-0020)
    "S110", # except-pass: swallowing an error silently (ADR-0020)
]

# --- pyright: strict type checking (ADR-0004) ---
# Strict everywhere. Files that touch untyped cflib (the Crazyflie adapter and
# tools/) opt down to basic mode with a "# pyright: basic" comment and a reason.
[tool.pyright]
include = ["src", "tests", "tools"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
