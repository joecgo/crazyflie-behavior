# Continuous integration (focus area 6): every push and pull request runs the
# same checks as a local run. Everything runs without hardware.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same layout as a local checkout, so pyright finds .venv the same way.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Formatting (ruff)
        run: .venv/bin/ruff format --check .

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Types (pyright, strict)
        run: .venv/bin/pyright

      - name: Tests and fitness functions (pytest)
        run: .venv/bin/python -m pytest
