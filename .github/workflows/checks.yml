# Continuous integration: every push and pull request runs the
# same checks as a local run. Everything runs without hardware.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Stops a hung run (ADR-0080).
    timeout-minutes: 15
    steps:
      # The full history: the project tour's link test reads the commit its links are pinned to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same layout as a local checkout, so pyright finds .venv the same way.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Formatting (ruff)
        run: .venv/bin/ruff format --check .

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Types (pyright, strict)
        run: .venv/bin/pyright

      - name: Tests and fitness functions (pytest)
        run: .venv/bin/python -m pytest
